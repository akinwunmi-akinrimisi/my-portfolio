[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# NO SPA catch-all. This is a single page with in-page anchors, not client-side
# routing, so a `/*  ->  /index.html  200` rule would make every URL on the domain
# return the full site with status 200 — soft 404s that Google flags as a quality
# problem and that waste crawl budget. Unknown paths must 404 properly, which
# Netlify does automatically using 404.html.

# dist/vercel.json exists so a Vercel deployment gets the same security headers.
# Netlify does not consume it, so it would otherwise be served as a public static
# file. It holds no secrets, but publishing build configuration is needless
# surface — return 404 for it here.
# `force = true` is required: without it Netlify serves the matching static file and
# the redirect never fires.
[[redirects]]
  from = "/vercel.json"
  to = "/404.html"
  status = 404
  force = true

# Security and caching headers are NOT defined here. They live in `dist/_headers`,
# generated by scripts/gen-headers.mjs during the build, because the CSP needs a
# SHA-256 hash of the inline theme script that can only be computed from the built
# artefact. Defining them in both places would risk the two drifting apart.
