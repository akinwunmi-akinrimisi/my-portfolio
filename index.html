    <!-- Fonts are self-hosted from /fonts (see scripts/fetch-fonts.mjs). No
         request leaves this origin at runtime, which removes a supply-chain
         vector and a per-visitor IP leak to a third party. -->
    <script>
      // Applied before first paint so the correct theme is never repainted.
      // The design is dark-first: dark is the default unless the visitor has
      // explicitly chosen light. The `js` class gates the scroll-reveal, so
      // without JavaScript every section renders visible rather than blank.
      (function () {
        document.documentElement.classList.add('js')
        try {
          var stored = localStorage.getItem('theme')
          document.documentElement.classList.toggle('dark', stored !== 'light')
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
